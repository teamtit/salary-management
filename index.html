<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: rgb(118, 176, 226);">
    <div class="container-fluid" id="container-box" style="background-color: rgb(118, 176, 226); ">
        <form action="" id="workerForm" class="container-fluid mt-5 " style="background-color: rgb(22, 106, 191); border-radius: 20px; border: 1px solid rgb(91, 189, 235);">
             <h1 class="pt-3 pb-4 d-flex justify-content-center" style="color: rgb(250, 250, 250);">Workers Details</h1>

             <label for="Drivername" style="color: white;">Driver Name</label> <br>
             <input type="text" id="Drivername" name="drivername" style="width: 80vw;" class="mt-1 mb-1 ms-2 me-2"> <br>

             <label for="dayamount" style="color: white;">Total Earnings</label> <br>
             <input type="number" id="dayamount" name="totalEarnings" style="width: 80vw;" class="mt-1 mb-1 ms-2 me-2"> <br>

             <label for="percentage" style="color: white;">Porter percentage</label> <br>
             <input type="number" name="porterpercentage" id="percentage" style="width: 80vw;" class="mt-1 mb-1 ms-2 me-2"> <br>

              <label for="earnings" style="color: white;">Earnings</label> <br>
             <input type="number" readonly name="earnings" id="earnings" style="width: 80vw;" class="mt-1 mb-1 ms-2 me-2"> <br>

             <label for="salarytype" style="color: white;">Select Type of Salary</label> <br>
             <select name="salaryType" id="salarytype" style="width: 80vw;" class="mt-1 mb-1 ms-2 me-2">
                <option value="rental">Rental salary</option>
                <option value="commission">commission based</option>
             </select> <br>


             <label for="workerincome" style="color: white;">Worker Income</label> <br>
             <input type="number"  name="workIncome"  id="workerincome" style="width: 80vw;" class="mt-1 mb-1 ms-2 me-2"><br>

             <label for="owner" style="color: white;">Owner Income</label> <br>
             <input type="number" name="ownerIncome"  id="ownerincome" style="width: 80vw;" class="mt-1 mb-1 ms-2 me-2"> <br>

             <label for="date" style="color: white;">Select Date</label> <br>
             <input type="date" name="date" id="date" style="width: 80vw;" class="mt-1 mb-1 ms-2 me-2"> <br>

             <input type="submit" class="mt-3 ms-2 mb-5" style="width: 30vw; height: 35px; border-radius: 20px; border: 1px solid rgb(227, 81, 59); color: rgb(246, 245, 244); background-color: orangered;">
        </form>
    </div>

    <div class="container mt-5">

    <div
        class="p-4"
        style="
            background-color: rgb(22, 106, 191);
            border-radius: 20px;
            border: 1px solid rgb(91, 189, 235);
        "
    >

        <h2 class="text-center text-white mb-4">
            Search Worker Details
        </h2>


        <!-- NAME -->

        <label class="text-white">
            Driver Name
        </label>

        <input
            type="text"
            id="searchName"
            class="form-control mb-3"
            placeholder="Enter driver name"
        >


        <!-- FROM DATE -->

        <label class="text-white">
            From Date
        </label>

        <input
            type="date"
            id="fromDate"
            class="form-control mb-3"
        >


        <!-- TO DATE -->

        <label class="text-white">
            To Date
        </label>

        <input
            type="date"
            id="toDate"
            class="form-control mb-3"
        >


        <!-- SEARCH BUTTON -->

        <button
            type="button"
            id="searchBtn"
            class="btn btn-warning mt-2"
        >
            Search
        </button>

    </div>

</div>

<div class="container mt-4">

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

                <tr>

                    <th>Date</th>

                    <th>Driver Name</th>

                    <th>Total Earnings</th>

                    <th>Porter Percentage</th>

                    <th>Earnings</th>

                    <th>Salary Type</th>

                    <th>Worker Income</th>

                    <th>Owner Income</th>

                </tr>

            </thead>


            <tbody id="workerTableBody">

            </tbody>

        </table>

    </div>

</div>
  
</body>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
